[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saasgraph"
version = "0.2.0"
description = "OAuth and SaaS exposure analysis with hybrid behavioral ML"
requires-python = ">=3.10"
dependencies = ["scikit-learn==1.7.2"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
saasgraph = "saasgraph.cli:main"

[tool.setuptools.packages.find]
include = ["saasgraph*"]
