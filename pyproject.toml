[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saasgraph"
version = "0.1.0"
description = "Synthetic OAuth and SaaS exposure analysis lab"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
saasgraph = "saasgraph.cli:main"

[tool.setuptools.packages.find]
include = ["saasgraph*"]
