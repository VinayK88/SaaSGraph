<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">SaaSGraph dashboard preview</title><desc id="desc">Static synthetic dashboard preview for OAuth posture, behavioral anomaly detection, and SaaS blast-radius analysis.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="30" font-weight="800" fill="#f8fafc">SaaSGraph</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.5" fill="#67e8f9">OAUTH POSTURE · BEHAVIORAL ML · SAAS BLAST RADIUS</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">OAUTH POSTURE</text><text x="68" y="184" font-size="24" font-weight="800" fill="#f8fafc">EXPLAINABLE</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">BEHAVIOR MODEL</text><text x="343" y="184" font-size="24" font-weight="800" fill="#a78bfa">ISOLATION FOREST</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">ACCESS GRAPH</text><text x="618" y="184" font-size="24" font-weight="800" fill="#38bdf8">BLAST RADIUS</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">RESPONSE MODE</text><text x="893" y="184" font-size="24" font-weight="800" fill="#4ade80">REVIEW-FIRST</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#0b1727" stroke="#29425b"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Exposure evidence</text><text x="72" y="298" font-size="12" fill="#94a3b8">Policy facts + behavioral deviation</text><circle cx="78" cy="343" r="6" fill="#38bdf8"/><text x="96" y="348" font-size="14" font-weight="650" fill="#dbeafe">Sensitive scopes and tenant-wide consent</text><circle cx="78" cy="391" r="6" fill="#a78bfa"/><text x="96" y="396" font-size="14" font-weight="650" fill="#dbeafe">Token persistence, dormancy and API deviation</text><circle cx="78" cy="439" r="6" fill="#f59e0b"/><text x="96" y="444" font-size="14" font-weight="650" fill="#dbeafe">Publisher trust and external-tenant boundary</text><circle cx="78" cy="487" r="6" fill="#4ade80"/><text x="96" y="492" font-size="14" font-weight="650" fill="#dbeafe">User and resource reach remain auditable</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#0b1727" stroke="#29425b"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">App → user → resource reach</text><text x="631" y="298" font-size="12" fill="#94a3b8">Graph evidence stays separate from ML score</text><rect x="647" y="350" width="112" height="54" rx="12" fill="#13243b" stroke="#1d4ed8"/><text x="703" y="382" text-anchor="middle" font-size="14" font-weight="800" fill="#93c5fd">OAuth app</text><path d="M760 377 H827" stroke="#64748b" stroke-width="3"/><circle cx="837" cy="377" r="10" fill="#38bdf8"/><path d="M847 377 H914" stroke="#64748b" stroke-width="3"/><rect x="924" y="350" width="150" height="54" rx="12" fill="#182438" stroke="#475569"/><text x="999" y="382" text-anchor="middle" font-size="14" font-weight="800" fill="#e2e8f0">SaaS resource</text><text x="631" y="457" font-size="13" fill="#cbd5e1">Hybrid priority = deterministic evidence + bounded anomaly signal</text><rect x="631" y="481" width="472" height="18" rx="9" fill="#172033"/><rect x="631" y="481" width="355" height="18" rx="9" fill="url(#accent)"/><text x="48" y="592" font-size="12" fill="#94a3b8">Preview uses synthetic/demo concepts only; anomaly scores are prioritization signals, not compromise probabilities.</text></g></svg>